<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&amp;display=swap');
        .title { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-weight: 600; font-size: 46px; fill: #111827; }
        .slogan { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 16px; fill: #111827; letter-spacing: 0.5px; font-weight: 500; }
    </style>
    <rect x="20" y="20" width="560" height="110" rx="55" ry="55" fill="#f8f9fa" stroke="#111827" stroke-width="3"/>
    
    <g>
        <!-- Círculo principal que envolve os triângulos -->
        <circle cx="90" cy="75" r="40" fill="#ea580c"/>
        <!-- Triângulos brancos contidos no interior -->
        <polygon points="90,75 72.8,103.8 107.2,103.8" fill="#f8f9fa" />
        <polygon points="90,75 72.8,103.8 107.2,103.8" fill="#f8f9fa" transform="rotate(120 90 75)" />
        <polygon points="90,75 72.8,103.8 107.2,103.8" fill="#f8f9fa" transform="rotate(240 90 75)" />
    </g>
    <text x="160" y="92" class="title">Bunker AppSec</text>
    <text x="195" y="165" class="slogan">Segurança em cada linha</text>
</svg>